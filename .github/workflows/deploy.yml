name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refreshes the listening data. 5 minutes is GitHub's practical floor, and
    # scheduled jobs still run late under load, so expect 5-20 minutes in
    # practice rather than a guarantee.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install

      # Writes public/listening.json, which Vite copies into dist/.
      # Deliberately non-fatal: a Last.fm outage must never block a deploy of
      # the rest of the site, and the page already handles missing data honestly.
      - name: Fetch listening data
        continue-on-error: true
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: ${{ secrets.LASTFM_USER }}
        run: node scripts/fetch-listening.mjs

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
